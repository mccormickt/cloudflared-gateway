name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string
      chart_only:
        description: "Publish the chart from an existing GitHub Release"
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Create GitHub Release + upload assets
      packages: write   # Push image + chart to GHCR
      id-token: write   # Cosign keyless signing via GitHub OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # GoReleaser changelog needs full history

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Helm OCI registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run GoReleaser
        if: ${{ !inputs.chart_only }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download existing release chart
        if: ${{ inputs.chart_only }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "cloudflared-gateway-${RELEASE_TAG#v}.tgz" \
            --pattern checksums.txt --dir chart-dist
          (cd chart-dist && sha256sum --check --ignore-missing checksums.txt)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Publish + sign Helm chart
        run: bash scripts/publish-chart.sh "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
