# Controller image
image:
  repository: ghcr.io/mccormickt/cloudflared-gateway
  tag: ""                  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# The GatewayClass controllerName this controller claims.
controllerName: jan0ski.net/cloudflared-gateway

# Cloudflare credentials.
# Either provide them inline (a Secret will be created) OR set existingSecret
# to the name of a pre-existing Secret with keys `account-id` and `api-token`.
cloudflare:
  accountId: ""
  apiToken: ""
  existingSecret: ""

serviceAccount:
  create: true
  name: ""                 # defaults to the release fullname
  annotations: {}

rbac:
  create: true             # creates ClusterRole + ClusterRoleBinding

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# Extra env vars for the manager container (merged after CF creds).
extraEnv: []

# DNS management.
dns:
  # Create proxied CNAME records (hostname -> <tunnelID>.cfargotunnel.com) for
  # every attached route hostname, so traffic reaches the tunnel without a manual
  # DNS step. Records are tagged with an owner comment, so only records this
  # controller created are ever updated or removed — pre-existing records are
  # left untouched. Per-Gateway opt-out: annotate a Gateway with
  # cloudflared-gateway.jan0ski.net/dns-managed: "false".
  #
  # Requires Zone:Read + DNS:Edit for zones in the configured account, in
  # addition to tunnel permissions. Wildcard hostnames are skipped.
  # Off by default; keep disabled when ExternalDNS manages these hostnames.
  enabled: false

# Install the bundled Gateway API experimental CRDs and safe-upgrade policies
# using the Helm/GitOps caller's permissions. Requires Kubernetes 1.30+.
# Leave disabled when a cluster administrator already manages Gateway API.
# Helm does not upgrade or delete CRDs; upgrade them separately before the controller.
gatewayAPI:
  enabled: false

# Experimental features.
experimental:
  backends:
    # Enable support for the experimental Gateway API XBackend resource
    # (gateway.networking.x-k8s.io), letting HTTPRoute/GRPCRoute/TLSRoute/TCPRoute
    # target external FQDN destinations. Requires the XBackend CRD to be installed
    # (the controller fails fast at startup otherwise).
    enabled: false
