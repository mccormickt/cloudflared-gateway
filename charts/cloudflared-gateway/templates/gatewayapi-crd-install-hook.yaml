{{- if .Values.experimental.installGatewayAPICRDs }}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail "Gateway API CRD installation requires Kubernetes >=1.30 for stable admission policies; disable experimental.installGatewayAPICRDs and manage CRDs out of band" }}
{{- end }}
{{- $version := toString .Values.experimental.gatewayAPIVersion }}
{{- if not (regexMatch "^v1[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$" $version) }}
{{- fail "experimental.gatewayAPIVersion must be a GA v1 release >=v1.6.0 (for example v1.6.3); the controller requires v1 APIs absent from older bundles" }}
{{- end }}
{{- if not (semverCompare ">=1.6.0" $version) }}
{{- fail "experimental.gatewayAPIVersion must be a GA v1 release >=v1.6.0 (for example v1.6.3); the controller requires v1 APIs absent from older bundles" }}
{{- end }}
{{- if and .Values.experimental.backends.enabled (not (regexMatch "^v1[.]6[.](0|[1-9][0-9]*)$" $version)) }}
{{- fail "experimental.gatewayAPIVersion must be a GA v1.6.x release when installing XBackend; use v1.6.3 or disable experimental.installGatewayAPICRDs" }}
{{- end }}
{{- /* Leave room for the 12-character suffix within the 63-character name limit. */}}
{{- $name := printf "%s-crd-install" (regexReplaceAll "-+$" (include "cloudflared-gateway.fullname" . | trunc 51) "") }}
{{- /* Distinct name label so controller selectors (NetworkPolicy, PDB) do not match hook pods. */}}
{{- $appName := printf "%s-crd-install" (regexReplaceAll "-+$" (include "cloudflared-gateway.name" . | trunc 51) "") }}
{{- $selectorLabels := dict "app.kubernetes.io/name" $appName "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "crd-install" }}
{{- $labels := merge (dict "helm.sh/chart" (include "cloudflared-gateway.chart" .) "app.kubernetes.io/managed-by" .Release.Service) $selectorLabels }}
{{- if .Chart.AppVersion }}
{{- $_ := set $labels "app.kubernetes.io/version" (toString .Chart.AppVersion) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: [apiextensions.k8s.io]
  resources: [customresourcedefinitions]
  verbs: [get, list, create, update, patch]
- apiGroups: [admissionregistration.k8s.io]
  resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
  verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- toYaml $selectorLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Only node affinity applies: controller pod (anti-)affinity terms could leave the hook unschedulable before controller pods exist. */}}
      {{- with (.Values.affinity | default dict).nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: install-crds
          image: {{ .Values.experimental.crdInstaller.image | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - kubectl
            - apply
            - --server-side
            - {{ printf "--field-manager=%s" $name | quote }}
            {{- if .Values.experimental.crdInstaller.forceConflicts }}
            - --force-conflicts
            {{- end }}
            - -f
            - {{ printf "https://github.com/kubernetes-sigs/gateway-api/releases/download/%s/standard-install.yaml" $version | quote }}
            {{- if .Values.experimental.backends.enabled }}
            - -f
            - {{ printf "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/%s/config/crd/experimental/gateway.networking.x-k8s.io_xbackends.yaml" $version | quote }}
            {{- end }}
{{- end }}
